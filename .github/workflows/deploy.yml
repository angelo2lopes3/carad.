name: Deploy site (GitHub Pages)

on:
  push:
    branches: [ main ]   # ajuste para o nome da sua branch principal
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # --- PASSO CRÍTICO -------------------------------------------------
      # Gera firebase-config.js a partir dos Secrets do repositório
      # (Settings > Secrets and variables > Actions > New repository secret)
      # Confira se os nomes abaixo (FIREBASE_API_KEY etc.) batem EXATAMENTE
      # com os nomes dos Secrets que você cadastrou no GitHub.
      # ---------------------------------------------------------------------
      - name: Gerar firebase-config.js
        run: |
          cat > firebase-config.js << EOF
          window.__FIREBASE_CONFIG__ = {
            apiKey: "${{ secrets.FIREBASE_API_KEY }}",
            authDomain: "${{ secrets.FIREBASE_AUTH_DOMAIN }}",
            projectId: "${{ secrets.FIREBASE_PROJECT_ID }}",
            storageBucket: "${{ secrets.FIREBASE_STORAGE_BUCKET }}",
            messagingSenderId: "${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}",
            appId: "${{ secrets.FIREBASE_APP_ID }}"
          };
          EOF

      # Confirma no log do Actions que o arquivo foi criado e não ficou vazio
      # (não mostra os valores, só confere que existe e tem conteúdo)
      - name: Verificar firebase-config.js
        run: |
          test -s firebase-config.js && echo "OK: firebase-config.js gerado" || (echo "ERRO: firebase-config.js vazio ou ausente" && exit 1)

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Upload do artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: .   # ajuste se seu index.html estiver em outra pasta (ex: ./dist)

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
